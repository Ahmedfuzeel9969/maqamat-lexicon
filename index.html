<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسان ترجمہ مقامات - لغت سسٹم</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 2px solid #bdc3c7; border-radius: 5px; font-size: 16px; resize: none; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.3s; }
        button:hover { background-color: #219653; }
        #result { margin-top: 25px; text-align: right; padding: 15px; background: #e8f8f5; border-right: 5px solid #2cc990; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>مقامات حریری - لغت سرچ سسٹم</h1>
    <textarea id="textInput" placeholder="یہاں عربی عبارت یا لفظ لکھیں..."></textarea>
    <button onclick="processText()">لغت میں تلاش کریں</button>

    <div id="result">
        <h3>نتائج:</h3>
        <p id="resultText"></p>
    </div>
</div>

<script>
    async function processText() {
        const textInput = document.getElementById('textInput').value;
        const resultDiv = document.getElementById('result');
        const resultText = document.getElementById('resultText');

        if (!textInput.trim()) {
            alert('براہ کرم کچھ عبارت لکھیے!');
            return;
        }

        resultText.innerText = 'تلاش جاری ہے...';
        resultDiv.style.display = 'block';

        try {
            // یہاں ہم نے مستقل آن لائن سرور کے لیے پاتھ درست کر دیا ہے
            const response = await fetch('/api/process-text', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: textInput })
            });

            if (!response.ok) {
                throw new Error('سرور کی طرف سے خرابی: ' + response.status);
            }

            const data = await response.json();
            resultText.innerText = data.result || 'کوئی نتیجہ نہیں ملا۔';
        } catch (error) {
            resultText.innerText = 'خرابی: ' + error.message;
        }
    }
</script>

</body>
</html>
